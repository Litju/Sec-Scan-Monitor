name: Feature request
description: Propose a bounded public-foundation improvement.
title: "feature: "
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What user or security problem does this solve?
    validations:
      required: true
  - type: textarea
    id: boundary
    attributes:
      label: Boundary and validation
      description: State authority, evidence, failure behavior, and what would remain NOT_VALIDATED.
    validations:
      required: true

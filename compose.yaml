# Optional local development services. Bindings are loopback-only.
# Set SECSCAN_POSTGRES_PASSWORD in the environment before enabling postgres.

services:
  postgres:
    image: postgres:16.6-alpine@sha256:589f3b24f30e60a2b33f79543ed51c8f897589bcde5c59f4dc0e814551eeeb0f
    profiles: ["postgres"]
    environment:
      POSTGRES_USER: secscan
      POSTGRES_PASSWORD: ${SECSCAN_POSTGRES_PASSWORD:?Set SECSCAN_POSTGRES_PASSWORD for local use}
      POSTGRES_DB: secscanmonitor
    ports:
      - "127.0.0.1:5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U secscan"]
      interval: 5s
      timeout: 3s
      retries: 10

  opa:
    image: openpolicyagent/opa:1.19.0@sha256:0d132d587c9b35e4047fdfab8f6931c356767e85ebac025fc148d6a61eb4f3ff
    profiles: ["opa"]
    command: ["run", "--server", "--addr", "127.0.0.1:8181"]
    ports:
      - "127.0.0.1:8181:8181"
